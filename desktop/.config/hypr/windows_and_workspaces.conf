windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# fsel should always be a centered popup
windowrule = match:class com.fsel, float true
windowrule = match:class com.fsel, size 400 800

windowrule = match:class com.clipboard_hist, float true
windowrule = match:class com.clipboard_hist, size 805 1000

windowrule = match:class com.logout_menu, float true
windowrule = match:class com.logout_menu, size 150 200

windowrule = match:class com.help, float true
windowrule = match:class com.help, size 705 680

# Due to launcher, doesn't respect starting workspace
windowrule = workspace 4 silent, match:class vesktop

# Project Celosia
windowrule = workspace 5, fullscreen on, match:class Game
