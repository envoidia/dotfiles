preload=~/.config/hypr/wall_miku.jpg
preload=~/.config/hypr/wall_veyle.png
preload=~/.config/hypr/wall_miku3.jpg

# main
wallpaper {
    monitor = DP-3
    path = ~/.config/hypr/wall_miku.jpg
    fit_mode = cover
}

# tv
wallpaper {
    monitor = HDMI-A-1
    path = ~/.config/hypr/wall_veyle.png
    fit_mode = cover
}

# secondary
wallpaper {
    monitor = DP-1
    path = ~/.config/hypr/wall_miku3.jpg
    fit_mode = cover
}

space = false
splash = false
ipc = off
